<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lift Log</title>

<meta name="theme-color" content="#10141e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/app.css?v=20">
</head>
<body>

<div id="app">
  <!-- ============ LOG / TODAY ============ -->
  <section id="screen-log" class="screen active">
    <div class="top">
      <h1 id="logTitle">Today</h1>
      <input type="date" id="logDate" class="datepick">
    </div>
    <div id="logSub" style="margin:-8px 2px 14px"></div>
    <div id="sessionBar"></div>
    <div id="logBody"></div>
    <button class="btn primary full" id="addExerciseBtn">+ Add exercise</button>
    <div id="notesCard" style="margin-top:14px"></div>
    <div style="height:14px"></div>
    <button class="btn ghost full small" id="finishBtn" style="display:none;color:var(--muted)">Finish &amp; clear today's view</button>
  </section>

  <!-- ============ HISTORY ============ -->
  <section id="screen-history" class="screen">
    <div class="top"><h1>History</h1></div>
    <button class="btn full" id="addPastBtn" style="margin-bottom:14px">+ Add past workout</button>
    <div id="weekSummary"></div>
    <div id="historyBody"></div>
  </section>

  <!-- ============ EXERCISES / PBs ============ -->
  <section id="screen-ex" class="screen">
    <div class="top">
      <h1>Exercises</h1>
      <span class="sub" id="exCount"></span>
    </div>
    <input class="in" id="exSearch" placeholder="Search your exercises…" style="margin-bottom:8px" autocapitalize="words">
    <button class="btn full" id="addExToListBtn" style="margin-bottom:12px">+ Add exercise / personal best</button>
    <div id="exBody"></div>
  </section>

  <!-- ============ COACH ============ -->
  <section id="screen-coach" class="screen">
    <div class="top">
      <h1>Coach</h1>
      <span class="sub" id="coachPlanDate"></span>
    </div>
    <div id="coachHead"></div>
    <div class="group-tabs" id="coachTabs"></div>
    <div id="coachBody"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="screen-more" class="screen">
    <div class="top"><h1>More</h1></div>
    <div id="authCard"></div>
    <div class="card">
      <div class="row between"><span>Total workouts</span><b id="statWorkouts">0</b></div>
      <hr class="hr"><div class="row between"><span>Exercises tracked</span><b id="statEx">0</b></div>
      <hr class="hr"><div class="row between"><span>Total sets logged</span><b id="statSets">0</b></div>
    </div>
    <div class="card" id="bwCard"></div>
    <div class="card" id="settingsCard"></div>
    <div class="card">
      <div class="small muted" style="margin-bottom:10px">Export a backup of all your data.</div>
      <button class="btn full" id="exportBtn" style="margin-bottom:8px">⬇︎ Export backup (JSON)</button>
      <button class="btn full" id="importBtn" style="margin-bottom:8px">⬆︎ Import backup</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
    </div>
    <div class="card">
      <button class="btn full danger ghost" id="wipeBtn">Erase all data</button>
    </div>
    <div class="card" id="devCard" style="display:none;border-color:var(--gold-dim)">
      <div class="small" style="font-weight:700;color:var(--gold);margin-bottom:4px">Localhost only</div>
      <div class="tiny muted" style="margin-bottom:10px">Demo data never syncs — it's flagged and skipped.</div>
      <button class="btn full sm" id="seedBtn" style="margin-bottom:8px">Load demo data</button>
      <button class="btn full sm ghost" id="unseedBtn">Clear demo data</button>
    </div>
    <div class="center faint tiny" style="margin-top:18px">Lift Log · kg <span id="buildTag"></span></div>
  </section>
</div>

<!-- ============ NAV ============ -->
<nav>
  <button data-tab="log" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M3 7l4-4M17 21l4-4M5 9L9 5M15 19l4-4M4 8l-1 1M21 16l-1 1"/></svg>
    Log
  </button>
  <button data-tab="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 3"/></svg>
    History
  </button>
  <button data-tab="ex">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    Exercises
  </button>
  <button data-tab="coach">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    Coach
  </button>
  <button data-tab="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    More
  </button>
</nav>

<!-- ============ SHEET ============ -->
<div class="pop" id="pbPop"><div class="pop-card"></div></div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" id="sheet"></div>
</div>

<!-- rest timer — fixed above the nav, so it survives tab switches -->
<div id="restBar"></div>

<div class="toast" id="toast"></div>

<script src="exercises.js?v=20"></script>
<!-- vendored, not CDN: a blocked or slow CDN used to abort the whole app script -->
<script src="vendor/supabase.js?v=20"></script>
<script src="js/core.js?v=20"></script>
<script src="js/session.js?v=20"></script>
<script src="js/log.js?v=20"></script>
<script src="js/history.js?v=20"></script>
<script src="js/library.js?v=20"></script>
<script src="js/coach.js?v=20"></script>
<script src="js/more.js?v=20"></script>
<script src="js/boot.js?v=20"></script>
</body>
</html>
