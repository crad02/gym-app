$("#logBody").addEventListener("click",e=>{
  const seg = e.target.closest("[data-type]");
  if(seg){
    const wrap = seg.closest("[data-typeseg]");
    const box = $("[data-segbox]", wrap), warmBtn = $(".warmtog", wrap);
    if(seg.classList.contains("warmtog")){
      const on = !warmBtn.classList.contains("on");
      warmBtn.classList.toggle("on", on);
      // a warm-up is always a straight set, never a drop
      if(on) $$("button",box).forEach(b=>b.classList.toggle("on", b.dataset.type==="work"));
    } else {
      $$("button",box).forEach(b=>b.classList.remove("on"));
      seg.classList.add("on");
      warmBtn.classList.remove("on");        // picking Working/Drop clears warm-up
    }
    const type = formType(wrap);
    box.classList.toggle("warmon", type==="warm");
    box.classList.toggle("dropon", type==="drop");
    const form = seg.closest("[data-setform]");
    const dw = $("[data-dropwrap]", form);
    if(dw){
      dw.style.display = type==="drop" ? "block" : "none";
      $("[data-wlabel]", form).textContent = type==="drop" ? "Top set (kg)" : "Weight (kg)";
      if(type==="drop" && !$("[data-droprow]", form)) addDropRow(form);   // start with one drop
    }
    return;
  }
  const adrop = e.target.closest("[data-adddrop]");
  if(adrop){ addDropRow(adrop.closest("[data-setform]")); return; }
  const ddrop = e.target.closest("[data-deldrop]");
  if(ddrop){ ddrop.closest("[data-droprow]").remove(); return; }
  const add = e.target.closest("[data-addset]");
  if(add){ addSet(+add.dataset.addset); return; }
  const dup = e.target.closest("[data-dup-set]");
  if(dup){ const [ei,si]=dup.dataset.dupSet.split(":").map(Number); dupSet(ei,si); return; }
  const ds = e.target.closest("[data-del-set]");
  if(ds){ const [ei,si]=ds.dataset.delSet.split(":").map(Number); delSet(ei,si); return; }
  const de = e.target.closest("[data-del-entry]");
  if(de){ delEntry(+de.dataset.delEntry); return; }
  // ── log v2 interactions ──
  const cancel = e.target.closest("[data-cancel-edit]");
  if(cancel){ editingSet = null; render(); return; }
  const pbp = e.target.closest("[data-pbpop]");
  if(pbp){ openPBPop(pbp.dataset.pbpop, pbp); return; }
  const aim = e.target.closest("[data-aim]");
  if(aim){
    const form = $(`[data-setform="${aim.dataset.aim}"]`);
    if(form){ $("[data-w]",form).value = aim.dataset.aimW; $("[data-r]",form).value = aim.dataset.aimR; }
    toast("Aim loaded — hit Add");
    return;
  }
  // ── supersets ──
  const ss = e.target.closest("[data-superset]");
  if(ss){
    const anchor = +ss.dataset.superset;
    openAddExercise({ title:"Pair with…", onChoose:(exId)=>addSupersetPartner(anchor, exId) });
    return;
  }
  const round = e.target.closest("[data-addround]");
  if(round){ addRound(round.dataset.addround); return; }
  const delr = e.target.closest("[data-del-round]");
  if(delr){
    const [g, r] = delr.dataset.delRound.split(":");
    delRound(g, +r);
    return;
  }
  const unlink = e.target.closest("[data-unlink]");
  if(unlink){ unlinkSuperset(unlink.dataset.unlink); return; }
  const again = e.target.closest("[data-again]");
  if(again){
    const wk = activeWorkout(false); if(!wk) return;
    const ei = +again.dataset.again;
    const sets = wk.entries[ei]?.sets || [];
    if(sets.length) dupSet(ei, sets.length-1);
    return;
  }
  const es = e.target.closest("[data-edit-set]");
  if(es && !e.target.closest("button")){
    const [ei,si] = es.dataset.editSet.split(":").map(Number);
    editingSet = (editingSet && editingSet.ei===ei && editingSet.si===si) ? null : {ei,si};
    render();
    return;
  }
  const head = e.target.closest("[data-card-head]");
  if(head && !e.target.closest("button")){
    const i = +head.dataset.cardHead;
    const wk = activeWorkout(false);
    const openIdx = (openEntry!==null) ? openEntry : (wk ? wk.entries.length-1 : -1);
    openEntry = (i === openIdx) ? -1 : i;   // tap open card → collapse all
    editingSet = null;
    render();
    return;
  }
});

// The set type is the segment choice (work|drop) unless the warm-up toggle
// overrides it — so it can't be read from a single ".on" button any more.
function formType(scope){
  const wrap = scope.matches && scope.matches("[data-typeseg]") ? scope : $("[data-typeseg]", scope);
  if(!wrap) return "work";
  if($(".warmtog", wrap).classList.contains("on")) return "warm";
  return ($("[data-segbox] [data-type].on", wrap) || {}).dataset?.type || "work";
}

// Focus + select, so typing replaces the prefilled value instead of appending
// to it. Called after re-renders too, which is why it tolerates a missing node.
function focusField(el){
  if(!el) return false;
  el.focus({ preventScroll:true });
  try{ el.select(); }catch(_){}
  return true;
}

// Enter advances weight → reps, and only submits from the last field. Firing
// the set from the weight box would log it against whatever reps was prefilled.
$("#logBody").addEventListener("keydown", e=>{
  if(e.key !== "Enter") return;
  const el = e.target;
  if(!el.matches || !el.matches("input")) return;
  e.preventDefault();

  // superset: weight → reps → next lift's weight → submit the round
  const ssRow = el.closest("[data-ssrow]");
  if(ssRow){
    if(el.matches("[data-ssw]")) return void focusField($("[data-ssr]", ssRow));
    const next = ssRow.nextElementSibling;
    if(next && next.matches("[data-ssrow]")) return void focusField($("[data-ssw]", next));
    return void addRound(ssRow.closest("[data-ssform]").dataset.ssform);
  }

  const form = el.closest("[data-setform]");
  if(!form) return;
  const dropRow = el.closest("[data-droprow]");
  if(dropRow && el.matches("[data-dw]")) return void focusField($("[data-dr]", dropRow));
  if(el.matches("[data-w]")) return void focusField($("[data-r]", form));
  addSet(+form.dataset.setform);
});

// Tapping a prefilled number should replace it, not drop a cursor mid-value.
$("#logBody").addEventListener("focusin", e=>{
  const el = e.target;
  if(el.matches && el.matches("[data-w],[data-r],[data-ssw],[data-ssr],[data-dw],[data-dr]"))
    requestAnimationFrame(()=>{ try{ el.select(); }catch(_){} });
});
$("#sheet").addEventListener("focusin", e=>{
  if(e.target.id==="resW" || e.target.id==="resR")
    requestAnimationFrame(()=>{ try{ e.target.select(); }catch(_){} });
});
$("#sheet").addEventListener("keydown", e=>{
  if(e.key !== "Enter") return;
  const add = $("#resAdd");
  if(add && (e.target.id === "resW" || e.target.id === "resR")){ e.preventDefault(); add.click(); }
});

function addDropRow(form){
  const rows = $("[data-droprows]", form);
  const div = document.createElement("div");
  div.className = "droprow"; div.setAttribute("data-droprow","");
  div.innerHTML = `<input class="in" inputmode="decimal" data-dw placeholder="drop kg">
    <input class="in" inputmode="numeric" data-dr placeholder="reps">
    <button class="iconbtn" data-deldrop aria-label="Remove drop">✕</button>`;
  rows.appendChild(div);
}

function addSet(entryIdx){
  const form = $(`[data-setform="${entryIdx}"]`);
  const type = formType(form);
  const w = parseFloat($("[data-w]",form).value);
  const r = parseInt($("[data-r]",form).value,10);
  if(!(w>=0) || !(r>0)){ toast(type==="drop"?"Enter the top set":"Enter weight & reps"); return; }
  let set;
  if(type==="drop"){
    const drops = [];
    for(const row of $$("[data-droprow]",form)){
      const dw = parseFloat($("[data-dw]",row).value), dr = parseInt($("[data-dr]",row).value,10);
      if(dw>=0 && dr>0) drops.push({ weight:dw, reps:dr });
    }
    if(!drops.length){ toast("Add at least one drop"); return; }
    set = { type:"drop", weight:w, reps:r, drops };
  } else {
    set = { type, weight:w, reps:r };
  }
  const wk = activeWorkout(true);

  // tap-to-edit: replace in place instead of appending
  if(editingSet && editingSet.ei===entryIdx && wk.entries[entryIdx].sets[editingSet.si]){
    wk.entries[entryIdx].sets[editingSet.si] = set;
    editingSet = null;
    save(); render(); toast("Set updated");
    return;
  }

  const prevPB = pbFor(wk.entries[entryIdx].exId);
  wk.entries[entryIdx].sets.push(set);
  save();
  const newPB = pbFor(wk.entries[entryIdx].exId);
  render();
  // render() replaced the form, so put the cursor back — otherwise the keyboard
  // drops between every set. Reps, not weight: the load usually repeats and the
  // reps usually don't, and both are already prefilled.
  focusField($(`[data-setform="${entryIdx}"] [data-r]`));
  const ex = exById(wk.entries[entryIdx].exId);
  const aim = ex ? coachAimFor(ex.name) : null;
  if(isHardSet(set) && newPB && (!prevPB || newPB.weight>prevPB.weight || (newPB.weight===prevPB.weight && newPB.reps>prevPB.reps))
     && newPB.weight===w && newPB.reps===r){
    toast("🏆 New PB!");
  } else if(set.type==="work" && aim && w>=aim.target_weight && r>=aim.target_reps){
    toast(`🎯 Aim hit — ${fmtKg(w)}×${r}`);
  } else {
    toast(type==="drop"?"Drop set added":"Set added");
  }
}
function dupSet(entryIdx,setIdx){
  const w = activeWorkout(false); if(!w) return;
  const s = w.entries[entryIdx].sets[setIdx];
  const copy = {...s};
  if(s.drops) copy.drops = s.drops.map(d=>({...d}));   // deep-copy a drop set's segments
  w.entries[entryIdx].sets.splice(setIdx+1, 0, copy);
  save(); render(); toast("Set repeated");
}
function delSet(entryIdx,setIdx){
  const w = activeWorkout(false); if(!w) return;
  const undo = snapshotWorkout(w);
  w.entries[entryIdx].sets.splice(setIdx,1);
  editingSet = null;   // indices shifted
  save(); render();
  toastUndo("Set deleted", undo);
}
function delEntry(entryIdx){
  const w = activeWorkout(false); if(!w) return;
  const name = (exById(w.entries[entryIdx].exId) || w.entries[entryIdx]).name || "Exercise";
  const undo = snapshotWorkout(w);
  w.entries.splice(entryIdx,1);
  if(!w.entries.length){ DB.workouts = DB.workouts.filter(x=>x!==w); }
  openEntry = null; editingSet = null;   // indices shifted; fall back to auto
  save(); render();
  toastUndo(`${name} removed`, undo);
}

$("#historyBody").addEventListener("click",e=>{
  const d = e.target.closest("[data-del-workout]");
  if(d){
    if(!confirm("Delete this entire workout?")) return;
    DB.workouts = DB.workouts.filter(w=>w.id!==d.dataset.delWorkout);
    save(); render(); toast("Deleted");
  }
});

$("#exSearch").addEventListener("input", renderEx);
$("#exBody").addEventListener("click",e=>{
  const d = e.target.closest("[data-ex-detail]");
  if(d) openExDetail(d.dataset.exDetail);
});
$("#sheet").addEventListener("click",e=>{
  const res = e.target.closest("[data-res]");
  if(res){
    const id = res.dataset.res;
    const date = $("#resDate").value || todayKey();
    const wv = parseFloat($("#resW").value), rv = parseInt($("#resR").value,10);
    if(!(wv>=0) || !(rv>0)){ toast("Enter weight & reps"); return; }
    const prevPB = pbFor(id);
    const wk = workoutFor(date, true);
    let en = wk.entries.find(x=>x.exId===id);
    if(!en){ const ex = exById(id); en = { exId:id, name:ex.name, sets:[] }; wk.entries.push(en); }
    en.sets.push({ type:"work", weight:wv, reps:rv });
    save();
    const newPB = pbFor(id);
    render();
    openExDetail(id);
    if(!prevPB || newPB.weight>prevPB.weight || (newPB.weight===prevPB.weight && newPB.reps>prevPB.reps)) toast("🏆 New PB!");
    else toast("Result added");
    return;
  }
  const editEx = e.target.closest("[data-edit-ex]");
  if(editEx){ openEditExercise(editEx.dataset.editEx); return; }
  if(e.target.id === "exEditBack"){ openExDetail($("[data-save-ex]").dataset.saveEx); return; }
  const saveEx = e.target.closest("[data-save-ex]");
  if(saveEx){ saveExerciseEdit(saveEx.dataset.saveEx); return; }
  const del = e.target.closest("[data-del-ex]");
  if(del){
    if(!confirm("Delete this exercise and remove it from all workouts? This cannot be undone.")) return;
    const id = del.dataset.delEx;
    DB.exercises = DB.exercises.filter(x=>x.id!==id);
    for(const w of DB.workouts){ w.entries = w.entries.filter(en=>en.exId!==id); }
    DB.workouts = DB.workouts.filter(w=>w.entries.length);
    save(); closeSheet(); render(); toast("Deleted");
  }
});

/* ---------- Dev seed (localhost only) ---------- */
// Real history sits behind Google auth, which only redirects back to the
// deployed origin — so on localhost there's nothing to look at. This fabricates
// a believable 12-session block instead. Everything it creates carries _demo,
// which keeps it out of sync() and makes it removable in one go.
const DEMO_SESSIONS = [
  { lifts:[ ["Barbell Row","Back",60,2.5,8,4], ["Lat Pulldown","Back",50,2.5,10,3],
            ["Preacher Curl","Biceps",22.5,1.25,10,3], ["Hammer Curl","Biceps",14,1,12,3] ] },
  { lifts:[ ["Bench Press","Chest",70,2.5,8,4], ["Overhead Press","Shoulders",40,1.25,8,3],
            ["Cable Fly","Chest",15,1.25,12,3], ["Tricep Pushdown","Triceps",25,1.25,12,3] ] },
  { lifts:[ ["Back Squat","Quads",90,5,6,4], ["Romanian Deadlift","Hamstrings",80,2.5,8,3],
            ["Leg Curl","Hamstrings",40,2.5,12,3], ["Calf Raise","Calves",60,2.5,15,3] ] },
];
const DEMO_PLAN = {
  generated_at: new Date().toISOString(),
  groups: {
    Back:  { priority:"high", why:"Volume has been below target for two weeks running.",
             focus:[ {exercise:"Barbell Row", app_exercise:"Barbell Row", target_weight:70, target_reps:8, expected_change:2.5},
                     {exercise:"Lat Pulldown", app_exercise:"Lat Pulldown", target_weight:60, target_reps:10, expected_change:2.5} ] },
    Arms:  { priority:"medium", why:"Progressing steadily — hold the current ramp.",
             focus:[ {exercise:"Preacher Curl", app_exercise:"Preacher Curl", target_weight:26.25, target_reps:10, expected_change:1.25},
                     {exercise:"Hammer Curl", app_exercise:"Hammer Curl", target_weight:17, target_reps:12, expected_change:0} ] },
    Chest: { priority:"medium", why:"Bench is on track; keep press volume where it is.",
             focus:[ {exercise:"Bench Press", app_exercise:"Bench Press", target_weight:77.5, target_reps:8, expected_change:2.5} ] },
    Legs:  { priority:"high", why:"Squat has stalled — the last two sessions repeated a load.",
             focus:[ {exercise:"Back Squat", app_exercise:"Back Squat", target_weight:105, target_reps:6, expected_change:-2.5} ] },
  }
};

const round25 = n => Math.round(n*4)/4;
function demoDateKey(daysAgo){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-daysAgo);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function ensureDemoExercise(name, muscle){
  let ex = DB.exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());
  if(!ex){ ex = { id:uid(), name, muscle, _demo:true }; DB.exercises.push(ex); }
  return ex;
}

function seedDemoData(){
  clearDemoData(true);
  const daysAgo = [40,37,33,30,26,23,19,16,12,9,5,2];      // oldest first, so loads climb
  daysAgo.forEach((ago,k)=>{
    const tpl = DEMO_SESSIONS[k % DEMO_SESSIONS.length];
    const cycle = Math.floor(k / DEMO_SESSIONS.length);     // 0..3 — one bump per cycle
    const start = new Date(); start.setDate(start.getDate()-ago); start.setHours(18,15,0,0);
    const durMin = 52 + ((k*7)%22);
    const w = { id:uid(), date:demoDateKey(ago), entries:[], _demo:true, _sync:'synced',
                startedAt:start.getTime(),
                lastActivityAt:start.getTime()+(durMin-3)*60000,
                endedAt:start.getTime()+durMin*60000 };
    tpl.lifts.forEach(([name,muscle,base,inc,reps,nsets],li)=>{
      const ex = ensureDemoExercise(name, muscle);
      // a stall every 4th session, so the chart isn't a synthetic straight line
      const weight = round25(base + inc*cycle - (k%4===3 ? inc : 0));
      const sets = [];
      if(li===0) sets.push({ type:"warm", weight:round25(weight*0.5), reps:10 });
      for(let s=0;s<nsets;s++) sets.push({ type:"work", weight, reps:Math.max(4, reps - (s>=2?1:0)) });
      if(li===tpl.lifts.length-1 && k%2===0)
        sets.push({ type:"drop", weight, reps,
                    drops:[{weight:round25(weight*0.75),reps:8},{weight:round25(weight*0.5),reps:6}] });
      w.entries.push({ exId:ex.id, name:ex.name, sets });
    });
    DB.workouts.push(w);
  });

  // pair the two curls on the latest session that actually has both, so
  // supersets have a subject (the most recent day is not always a pull day)
  const pull = [...DB.workouts].reverse().find(w=>
    w.entries.some(en=>en.name==="Preacher Curl") && w.entries.some(en=>en.name==="Hammer Curl"));
  if(pull){
    const g = uid();
    pull.entries.find(en=>en.name==="Preacher Curl").group = g;
    pull.entries.find(en=>en.name==="Hammer Curl").group = g;
  }

  persist();
  localStorage.setItem(PLAN_KEY, JSON.stringify(DEMO_PLAN));
  render();
}

function clearDemoData(silent){
  DB.workouts = DB.workouts.filter(w=>!w._demo);
  const stillUsed = new Set(DB.workouts.flatMap(w=>w.entries.map(en=>en.exId)));
  DB.exercises = DB.exercises.filter(e=>!e._demo || stillUsed.has(e.id));
  persist();
  if(!silent){
    try{ if(JSON.parse(localStorage.getItem(PLAN_KEY))?.groups?.Back?.why === DEMO_PLAN.groups.Back.why)
      localStorage.removeItem(PLAN_KEY); }catch(_){}
    render();
  }
}

/* ---------- Backup ---------- */
$("#exportBtn").addEventListener("click",()=>{
  // strip internal _sync field from export
  const exportDB = {
    exercises: DB.exercises,
    workouts: DB.workouts.map(({ _sync, ...rest }) => rest)
  };
  const data = JSON.stringify(exportDB,null,2);
  const blob = new Blob([data],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=`liftlog-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Backup downloaded");
});
$("#importBtn").addEventListener("click",()=>$("#importFile").click());
$("#importFile").addEventListener("change",e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const obj = JSON.parse(reader.result);
      if(!obj.exercises || !obj.workouts) throw 0;
      if(!confirm("Replace ALL current data with this backup?")) return;
      DB = obj;
      // mark all imported workouts as pending so they sync up
      if(currentUser) DB.workouts.forEach(w => { if(w.entries.length) w._sync = 'pending'; });
      persist();
      render();
      toast("Backup restored");
      if(currentUser) syncPending();
    }catch(err){ alert("Invalid backup file."); }
  };
  reader.readAsText(file);
  e.target.value="";
});
$("#wipeBtn").addEventListener("click",()=>{
  if(!confirm("Erase ALL data permanently? Export a backup first if unsure.")) return;
  if(!confirm("Really erase everything?")) return;
  DB = { exercises:[], workouts:[] }; save(); render(); toast("All data erased");
});

$("#seedBtn").addEventListener("click",()=>{ seedDemoData(); toast("Demo data loaded"); });
$("#unseedBtn").addEventListener("click",()=>{ clearDemoData(false); toast("Demo data cleared"); });

/* ---------- Boot ---------- */
finalizeStaleSessions();
render();
initAuth();
window.addEventListener('online', ()=>{ if(currentUser) syncPending(); });
// Skip the SW on localhost so edits land on a plain refresh; unregister any
// stale one left over from an earlier visit.
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  if(isLocalDev){
    navigator.serviceWorker.getRegistrations()
      .then(rs => rs.forEach(r => r.unregister())).catch(()=>{});
  } else {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    // the shell is served from cache first, so a new version lands on the next
    // launch — say so rather than leaving you on an old build unknowingly
    navigator.serviceWorker.addEventListener("message", ev=>{
      if(ev.data && ev.data.type === "update-ready") toast("Update ready — reopen the app");
    });
  }
}
</script>
